name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch toolchain drift on the runners

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/lint.py

  selftest:
    name: selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils file xxd gdb strace make

      - name: Install Rosetta 2 (Apple Silicon runners)
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Environment check
        run: python3 tools/check_env.py

      - name: Module self-test
        run: python3 tools/selftest.py
